<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Formulários</title>
</head>
<body>
    <h1>Denovo</h1>
    <form action="cadastro.php" method="get">
        <p>
            <label for="imail">E-mail</label>
            <input type="email" name="mail" id="imail" required autocomplete="email">
        </p>
        <p>
            <label for="ifon">Telefone: </label>
            <input type="number" name="fon" id="ifon" required autocomplete="tel">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
