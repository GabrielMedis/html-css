<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendendo sobre formulários</title>
</head>
<body>
    <h1>DENOVO</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isxmas"> <label for="imas">Masculino</label><br>
            <input type="radio" name="sexo" id="isxfem"><label for="ifem">Feminino</label><br>
        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos</legend>
            <input type="checkbox" name="esfut" id="iesfut"> <label for="iesfut">Futbol</label><br>
            <input type="checkbox" name="ba" id="ibas"><label for="ibas">baquete</label><br>
            <input type="checkbox" name="hand" id="ihand"><label for="ihand">handball</label><br>
            <input type="checkbox" name="voley" id="ivoley"><label for="ivoley">voleyball</label><br>
            <input type="checkbox" name="box" id="ibox"><label for="ibox">box</label>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
