<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEX</title>
    <style>
        div#container {
            background-color: lightgrey;
            display:flex;
            flex-flow: row nowrap;
        }

        div.item {
            background: lightskyblue;
            border: 1px solid black;
            text-align: center;
        }
        div.item#caixaA {
            flex: 2 1 250px;
        }
        div.item#caixaB {
            flex: 1 2 250px;
        }
        div.item#caixaC {
            flex: 0 0 250px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="item" id="caixaA">A</div>
        <div class="item" id="caixaB">B</div>
        <div class="item" id="caixaC">C</div>
    </div>
</body>
</html>
