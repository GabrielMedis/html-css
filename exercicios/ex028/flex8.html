<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEX</title>
    <style>
        div#container {
            background-color: lightgrey;
            display:flex;
            flex-flow: row nowrap;
        }

        div.item {
            background: lightskyblue;
            border: 1px solid black;
            text-align: center;
            flex-basis:250px;
        }
        div.item#caixaA {
            flex-shrink: 1;
            flex-grow: 0;
        }
        div.item#caixaB {
            flex-shrink: 1;
            flex-grow: 2;
        }
        div.item#caixaC {
            flex-shrink: 0;
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="item" id="caixaA">A</div>
        <div class="item" id="caixaB">B</div>
        <div class="item" id="caixaC">C</div>
    </div>
</body>
</html>
